[project]
name = "long-horizon-bench"
version = "0.1.0"
description = "Long-Horizon-Bench: A benchmark for evaluating AI agents on long-horizon, complex tasks in terminal environments."
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.45.2",
    "docker>=7.1.0",
    "openai>=1.59.9",
    "pydantic>=2.10.5",
    "pyyaml>=6.0.0",
    "ruamel-yaml>=0.18.10",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "tqdm>=4.67.1",
    "typer>=0.16.0",
    "litellm>=1.67.5",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
long-horizon-bench = "long_horizon_bench.cli.main:app"
lhb = "long_horizon_bench.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["tasks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["long_horizon_bench"]
known-third-party = ["docker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["long_horizon_bench"]
