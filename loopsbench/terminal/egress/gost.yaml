# Adapted from Harbor for LoopsBench; see NOTICE and LICENSE.harbor.
# addr, so_mark, and file.path must match bin/network-policy.
services:
  - name: transparent-egress
    addr: ":12345"
    bypass: allowlist
    metadata:
      so_mark: 114514
    handler:
      type: red
      metadata:
        # Package gateways can spend up to 300s fetching a response. Keep the
        # proxy header deadline above that bound; task timeouts still apply.
        readTimeout: 330s
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: true
    listener:
      type: red

bypasses:
  - name: allowlist
    whitelist: true
    reload: 1s
    file:
      path: /opt/egress-sidecar/allowlist.txt
