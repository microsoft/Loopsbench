name: Task PR Full Validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-task-pr-full:
    runs-on: [self-hosted, loopsbench-sandbox]
    timeout-minutes: 720

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: List changed files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/list_pr_changed_files.py --event-path "$GITHUB_EVENT_PATH" > changed_files.txt

      - name: Detect changed tasks
        id: changed_tasks
        shell: bash
        run: |
          python3 scripts/list_changed_tasks.py \
            --paths-file changed_files.txt | tee changed_tasks.txt
          if [ -s changed_tasks.txt ]; then
            echo "has_tasks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tasks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.changed_tasks.outputs.has_tasks == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install trusted LoopsBench
        if: steps.changed_tasks.outputs.has_tasks == 'true'
        run: pip install -e .

      - name: Checkout pull request contents
        if: steps.changed_tasks.outputs.has_tasks == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Validate changed task paths
        if: steps.changed_tasks.outputs.has_tasks == 'true'
        run: python3 scripts/check_task_pr_paths.py --paths-file changed_files.txt

      - name: Run full contribution validation
        if: steps.changed_tasks.outputs.has_tasks == 'true'
        shell: bash
        run: |
          mkdir -p .artifacts/contribution-validation
          while IFS= read -r task_dir; do
            [ -n "$task_dir" ] || continue
            task_id="$(basename "$task_dir")"
            python3 scripts/validate_task_contribution.py \
              --task-dir "pr/$task_dir" \
              --run-tasks-validate \
              --run-oracle \
              --oracle-output-root ".artifacts/oracle/$task_id" \
              --json-out ".artifacts/contribution-validation/$task_id.json"
          done < changed_tasks.txt

      - name: Write task overview summary
        if: always() && steps.changed_tasks.outputs.has_tasks == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          report_dir = Path(".artifacts/contribution-validation")
          lines = [
              "## Task PR Full Validation Summary",
              "",
              "| Task ID | Static | `loopsbench tasks validate` | Oracle |",
              "| --- | --- | --- | --- |",
          ]
          for report_path in sorted(report_dir.glob("*.json")):
              payload = json.loads(report_path.read_text(encoding="utf-8"))
              commands = {item["name"]: item for item in payload.get("commands", [])}
              static_result = "passed" if not payload.get("issues") else "failed"
              lhb_result = "passed" if commands.get("loopsbench_tasks_validate", {}).get("returncode") == 0 else "failed"
              oracle_result = "passed" if commands.get("oracle", {}).get("returncode") == 0 else "failed"
              lines.append(
                  f"| `{payload['task_id']}` | {static_result} | {lhb_result} | {oracle_result} |"
              )
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contribution-validation-artifacts
          path: .artifacts

      - name: No task changes
        if: steps.changed_tasks.outputs.has_tasks != 'true'
        run: echo "No task directories changed in this pull request; full task validation was skipped."
